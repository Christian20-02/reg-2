<h2>Courses</h2>

<form class="filters" (ngSubmit)="apply()">
  <input
    placeholder="Search title / code / instructor"
    [(ngModel)]="q"
    name="q"
  />
  <input
    placeholder="Department (e.g., CSCI)"
    [(ngModel)]="dept"
    name="dept"
  />
  <button class="btn">Apply</button>
</form>

<p class="ok" *ngIf="msg && !err">{{ msg }}</p>
<p class="err" *ngIf="err">{{ err }}</p>

<table class="grid" *ngIf="courses.length">
  <thead>
    <tr>
      <th>Code</th>
      <th>Title</th>
      <th>Dept</th>
      <th>Instructor</th>
      <th>Credits</th>
      <th>Seats</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let c of courses">
      <td>{{ c.code }}</td>
      <td>{{ c.title }}</td>
      <td>{{ c.department }}</td>
      <td>{{ c.instructor }}</td>
      <td>{{ c.credits }}</td>
      <td>{{ c.enrolled }}/{{ c.capacity }}</td>
      <td>
        <button type="button" class="btn" (click)="enroll(c.id)">Enroll</button>
        <button type="button" class="btn ghost" (click)="drop(c.id)">Drop</button>
      </td>
    </tr>
  </tbody>
</table>
